<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
          <h4 class="mb-0">
            <i class="bi bi-arrow-left-right me-2"></i>
            Transferencia entre Beneficios
          </h4>
        </div>

        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">
                  Origem <span class="text-danger">*</span>
                </label>
                <select class="form-select" formControlName="fromId">
                  <option [value]="null">Selecione...</option>
                  @for (beneficio of beneficios(); track beneficio.id) {
                    <option [value]="beneficio.id">
                      {{ beneficio.nome }} - {{ formatCurrency(beneficio.valor) }}
                    </option>
                  }
                </select>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">
                  Destino <span class="text-danger">*</span>
                </label>
                <select class="form-select" formControlName="toId">
                  <option [value]="null">Selecione...</option>
                  @for (beneficio of beneficios(); track beneficio.id) {
                    <option [value]="beneficio.id">
                      {{ beneficio.nome }} - {{ formatCurrency(beneficio.valor) }}
                    </option>
                  }
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">
                Valor <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text">R$</span>
                <input
                  type="number"
                  class="form-control"
                  formControlName="amount"
                  step="0.01"
                  min="0.01"
                  placeholder="0.00">
              </div>
            </div>

            @if (form.get('fromId')?.value && form.get('amount')?.value) {
              <div class="alert alert-info">
                <i class="bi bi-info-circle me-2"></i>
                Saldo restante: <strong>{{ formatCurrency(getSaldoRestante()) }}</strong>
              </div>
            }

            <div class="d-flex gap-2 justify-content-end mt-4">
              <button
                type="button"
                class="btn btn-secondary"
                (click)="onCancel()"
                [disabled]="loading()">
                Cancelar
              </button>
              <button
                type="submit"
                class="btn btn-success"
                [disabled]="loading()">
                @if (loading()) {
                  <span class="spinner-border spinner-border-sm me-2"></span>
                  Transferindo...
                } @else {
                  <i class="bi bi-check-lg me-2"></i>
                  Transferir
                }
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
